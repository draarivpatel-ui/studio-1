<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Studio</title>
<meta name="description" content="Batch resize, compress and watermark photos and PDFs in your browser. Nothing is uploaded.">
<style>
:root{--bg:#faf8f3;--fg:#111;--mut:#666;--line:#111;--acc:#111}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#f3f1ea;--mut:#9a9a9a;--line:#f3f1ea;--acc:#f3f1ea}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:28px;margin:8px 0 4px}p.sub{color:var(--mut);margin:0 0 24px}
.tabs{display:flex;border:1px solid var(--line);margin-bottom:16px}
.tabs button{flex:1;padding:10px;background:none;border:0;color:var(--fg);font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--bg)}
#drop{border:1px dashed var(--line);padding:32px;text-align:center;cursor:pointer;margin-bottom:16px}
#drop.over{background:rgba(128,128,128,.15)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px;flex:1;min-width:140px}
input,select{font:inherit;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button.go{width:100%;padding:12px;background:var(--acc);color:var(--bg);border:0;font:inherit;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.4;cursor:default}
#log{margin-top:16px;font-size:14px;color:var(--mut);white-space:pre-wrap}
.lock{border:1px solid var(--line);padding:12px;margin-top:24px;font-size:14px}
a{color:var(--fg)}
</style>
</head>
<body>
<main>
<h1>Local Studio</h1>
<p class="sub">Photos and PDFs, processed in your browser. Nothing is uploaded.</p>
<div class="tabs" role="tablist">
<button role="tab" id="t-photo" aria-selected="true">Photos</button>
<button role="tab" id="t-pdf" aria-selected="false">PDF</button>
</div>
<div id="drop" tabindex="0">Drop files here or click to choose<input id="file" type="file" multiple hidden></div>
<div id="list" class="sub"></div>

<section id="photo">
<div class="row">
<label>Size (px, longest side or square)<input id="size" type="number" value="1200" min="100" max="6000"></label>
<label>Crop<select id="crop"><option value="fit">Keep proportions</option><option value="square">Square crop</option></select></label>
<label>JPEG quality (%)<input id="q" type="number" value="82" min="30" max="100"></label>
<label>Watermark text<input id="wm" placeholder="optional"></label>
</div>
</section>

<section id="pdf" hidden>
<div class="row">
<label>Action<select id="pdfmode"><option value="merge">Merge into one PDF</option><option value="shrink">Shrink (re-render pages)</option><option value="mark">Add watermark only</option></select></label>
<label>Shrink quality (%)<input id="pq" type="number" value="60" min="20" max="95"></label>
<label>Watermark text<input id="pwm" placeholder="optional"></label>
</div>
</section>

<button class="go" id="run" disabled>Process</button>
<div id="log"></div>

<div class="lock" id="lock"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// ---- unlock (set these two for your Stripe Payment Link) ----
const PAYMENT_LINK = "https://buy.stripe.com/REPLACE_ME";
const UNLOCK_TOKEN = "REPLACE_WITH_RANDOM_STRING";
const FREE_FILES = 5, MARK = "flisk studio";
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };
const qs = new URLSearchParams(location.search);
if (qs.get("unlocked") === UNLOCK_TOKEN) { store.set("studio-unlocked","1"); history.replaceState(null,"",location.pathname); }
const unlocked = () => store.get("studio-unlocked") === "1";
function renderLock(){
  document.getElementById("lock").innerHTML = unlocked()
    ? `Unlocked: no limits, no mark. Thank you. To unlock another browser or device, <a href="${location.origin}${location.pathname}?unlocked=${UNLOCK_TOKEN}">bookmark this link</a>.`
    : `Free: ${FREE_FILES} files per batch and a small "${MARK}" mark. <a href="${PAYMENT_LINK}">Unlock for good</a> (one payment, no account).`;
}
renderLock();

// ---- ui ----
const $ = id => document.getElementById(id);
let files = [], mode = "photo";
function setMode(m){ mode=m; $("photo").hidden=m!=="photo"; $("pdf").hidden=m!=="pdf";
  $("t-photo").setAttribute("aria-selected",m==="photo"); $("t-pdf").setAttribute("aria-selected",m==="pdf");
  $("file").accept = m==="photo" ? "image/*" : "application/pdf"; files=[]; refresh(); }
$("t-photo").onclick=()=>setMode("photo"); $("t-pdf").onclick=()=>setMode("pdf");
function refresh(){ $("list").textContent = files.length ? files.length+" file(s): "+files.map(f=>f.name).slice(0,6).join(", ")+(files.length>6?"…":"") : "";
  $("run").disabled = !files.length; }
function addFiles(list){ const ok = [...list].filter(f => mode==="photo" ? f.type.startsWith("image/") : f.type==="application/pdf"); files = files.concat(ok); refresh(); }
$("drop").onclick=()=>$("file").click();
$("file").onchange=e=>{addFiles(e.target.files); e.target.value="";};
["dragover","dragenter"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.add("over")}));
["dragleave","drop"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.remove("over")}));
$("drop").addEventListener("drop",e=>addFiles(e.dataTransfer.files));
const log = s => $("log").textContent = s;
function save(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }
const kb = n => (n/1024).toFixed(0)+" KB";

// ---- photos ----
async function photoBatch(){
  const size=+$("size").value, sq=$("crop").value==="square", q=+$("q").value/100, wm=$("wm").value.trim();
  const zip=new JSZip(); let i=0, before=0, after=0;
  for (const f of files) {
    log(`Photo ${++i} of ${files.length}…`);
    const bmp = await createImageBitmap(f);
    let sw=bmp.width, sh=bmp.height, sx=0, sy=0, w, h;
    if (sq) { const s=Math.min(sw,sh); sx=(sw-s)/2; sy=(sh-s)/2; sw=sh=s; w=h=Math.min(size,s); }
    else { const k=Math.min(1,size/Math.max(sw,sh)); w=Math.round(sw*k); h=Math.round(sh*k); }
    const c=document.createElement("canvas"); c.width=w; c.height=h;
    const g=c.getContext("2d"); g.drawImage(bmp,sx,sy,sw,sh,0,0,w,h);
    stamp(g,w,h,wm);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
    before+=f.size; after+=blob.size;
    zip.file(f.name.replace(/\.[^.]+$/,"")+".jpg", blob);
  }
  save(await zip.generateAsync({type:"blob"}),"photos.zip");
  log(`Done. ${files.length} photo(s), ${kb(before)} → ${kb(after)}. ZIP saved.`);
}
function stamp(g,w,h,text){
  const fs=Math.max(12,Math.round(w/28));
  g.textBaseline="bottom"; g.font=`600 ${fs}px sans-serif`;
  const draw=(t,x,y,a)=>{g.fillStyle=`rgba(255,255,255,${a})`;g.strokeStyle="rgba(0,0,0,.45)";g.lineWidth=fs/12;g.strokeText(t,x,y);g.fillText(t,x,y);};
  if(text){ g.textAlign="center"; draw(text,w/2,h/2+fs/2,.55); }
  if(!unlocked()){ g.textAlign="right"; g.font=`600 ${Math.round(fs*.6)}px sans-serif`; draw(MARK,w-fs/2,h-fs/2,.7); }
}

// ---- pdf ----
async function pdfBatch(){
  const m=$("pdfmode").value, wm=$("pwm").value.trim();
  const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
  if (m==="merge") {
    const out=await PDFDocument.create();
    for (const f of files){ const d=await PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});
      (await out.copyPages(d,d.getPageIndices())).forEach(p=>out.addPage(p)); }
    await watermarkDoc(out,wm); save(new Blob([await out.save()],{type:"application/pdf"}),"merged.pdf");
    return log(`Merged ${files.length} PDF(s), ${out.getPageCount()} pages.`);
  }
  if (m==="mark") {
    let i=0; const zip=files.length>1?new JSZip():null;
    for (const f of files){ log(`PDF ${++i} of ${files.length}…`);
      const d=await PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true}); await watermarkDoc(d,wm);
      const b=new Blob([await d.save()],{type:"application/pdf"}); zip?zip.file(f.name,b):save(b,f.name); }
    if(zip) save(await zip.generateAsync({type:"blob"}),"pdfs.zip"); return log("Done.");
  }
  // shrink: render each page to JPEG, rebuild. Strips hidden text and metadata; text is no longer selectable.
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const q=+$("pq").value/100; const zip=files.length>1?new JSZip():null; let before=0, after=0, i=0;
  for (const f of files){
    log(`PDF ${++i} of ${files.length}…`); before+=f.size;
    const src=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    const out=await PDFDocument.create();
    for (let n=1;n<=src.numPages;n++){
      const pg=await src.getPage(n), vp=pg.getViewport({scale:1.5});
      const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
      await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      const jpg=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
      const img=await out.embedJpg(await jpg.arrayBuffer());
      const base=pg.getViewport({scale:1}); const p=out.addPage([base.width,base.height]);
      p.drawImage(img,{x:0,y:0,width:base.width,height:base.height}); log(`PDF ${i}: page ${n} of ${src.numPages}…`);
    }
    await watermarkDoc(out,wm);
    const b=new Blob([await out.save()],{type:"application/pdf"}); after+=b.size; zip?zip.file(f.name,b):save(b,f.name);
  }
  if(zip) save(await zip.generateAsync({type:"blob"}),"pdfs.zip");
  log(`Done. ${kb(before)} → ${kb(after)}.`);
}
async function watermarkDoc(doc,text){
  const { StandardFonts, rgb, degrees } = PDFLib; const font=await doc.embedFont(StandardFonts.HelveticaBold);
  for (const p of doc.getPages()){ const {width,height}=p.getSize();
    if(text) p.drawText(text,{x:width*.15,y:height*.35,size:Math.max(24,width/10),font,color:rgb(.5,.5,.5),opacity:.25,rotate:degrees(35)});
    if(!unlocked()) p.drawText(MARK,{x:width-90,y:12,size:9,font,color:rgb(.4,.4,.4),opacity:.8}); }
}

$("run").onclick=async()=>{
  if(!unlocked() && files.length>FREE_FILES){ files=files.slice(0,FREE_FILES); refresh(); log(`Free batch is ${FREE_FILES} files; using the first ${FREE_FILES}.`); await new Promise(r=>setTimeout(r,800)); }
  $("run").disabled=true;
  try{ await (mode==="photo"?photoBatch():pdfBatch()); }catch(e){ log("Failed: "+(e&&e.message||e)); }
  $("run").disabled=!files.length;
};
setMode("photo");
</script>
</body>
</html>
