# Local files studio: static site, everything runs in the visitor's browser. No D1, no secrets.
# Build first (bun install && bun run build), then deploy from this folder: bunx wrangler@4 deploy
name = "flisk-studio"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"

[[routes]]
pattern = "studio.flisk.si"
custom_domain = true
