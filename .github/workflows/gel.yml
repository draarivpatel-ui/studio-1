name: GEL
on:
  pull_request:
  # the merge queue only runs workflows that listen for merge_group; GEL is a required check there
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gel-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gel:
    permissions: { contents: read, checks: read, pull-requests: read }
    uses: flisk-sh/gel/.github/workflows/gel.yml@206955e0711507d5a354cbb63ab19e7e937dd23e # v1.16.0
    with: { gel_ref: 206955e0711507d5a354cbb63ab19e7e937dd23e }
