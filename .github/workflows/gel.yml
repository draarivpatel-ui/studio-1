name: GEL
on:
  pull_request:
  # the merge queue only runs workflows that listen for merge_group; GEL is a required check there
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gel-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gel:
    permissions: { contents: read, checks: read, pull-requests: read }
    uses: flisk-sh/gel/.github/workflows/gel.yml@e2bdfc26509c106eb5cbb2a8be7e10d6ec842008 # v1.15.0
    with: { gel_ref: e2bdfc26509c106eb5cbb2a8be7e10d6ec842008 }
