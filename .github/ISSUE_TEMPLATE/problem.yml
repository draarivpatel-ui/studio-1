name: Report a problem
description: Something in the Studio did not work or looks wrong
labels: [problem]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please do not attach private files: describe them instead (type, size, what is in them). A fix may be made automatically, so the more exact you are, the better it works.
  - type: dropdown
    id: task
    attributes:
      label: Which task?
      options: [Photos, Merge PDFs, Shrink PDFs, Watermark PDFs, The page itself]
    validations: {required: true}
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What did you pick, which settings, and what did you see?
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations: {required: true}
  - type: input
    id: file
    attributes:
      label: File type and size
      placeholder: "Example: iPhone JPEG, 4032 x 3024, 3 MB"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Example: Safari on iPhone 15"
  - type: checkboxes
    id: private
    attributes:
      label: Privacy
      options:
        - label: I did not include private files or personal data in this report
          required: true
